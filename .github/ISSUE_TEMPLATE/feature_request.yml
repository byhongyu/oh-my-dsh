name: Feature request
description: Suggest a focused improvement to oh-my-dsh
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Large behavioral or architectural proposals may need design discussion before implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: security
    attributes:
      label: Trust-boundary impact
      description: Note any effect on permissions, imports, Git sources, filesystem access, credentials, or plugin loading.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This request stays within oh-my-dsh's documented scope.
          required: true
