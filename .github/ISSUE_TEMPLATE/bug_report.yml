name: Bug report
description: Report a reproducible problem in oh-my-dsh
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include credentials, private setup contents, or security vulnerabilities here.

  - type: input
    id: version
    attributes:
      label: oh-my-dsh version
      description: Run `oh-my-dsh --version` if possible.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.1.0-rc.5
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the exact command and the smallest safe example that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant output after removing credentials, machine paths, and private setup data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
