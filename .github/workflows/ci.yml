name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test with coverage gates
        run: pnpm test:coverage

      - name: Build release bundle
        run: pnpm build

      - name: Smoke-test packed CLI
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/package" "${RUNNER_TEMP}/install" "${RUNNER_TEMP}/npm-cache"
          pnpm --dir packages/cli pack --pack-destination "${RUNNER_TEMP}/package"
          npm install \
            --prefix "${RUNNER_TEMP}/install" \
            --cache "${RUNNER_TEMP}/npm-cache" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "${RUNNER_TEMP}/package/oh-my-dsh-0.1.0.tgz"
          "${RUNNER_TEMP}/install/node_modules/.bin/oh-my-dsh" --version
          "${RUNNER_TEMP}/install/node_modules/.bin/oh-my-dsh" list --json >/dev/null
